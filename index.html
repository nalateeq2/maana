  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l===st.lang)));
  let html = '', last = '';
  STEPS[st.lang].forEach((s,i) => { if (s.stage!==last){ html += `<h3>${s.stage}</h3>`; last = s.stage; } html += `<button type="button" data-i="${i}"><i>${i+1}</i><span>${s.t}</span></button>`; });
  $('.list').innerHTML = html;
}
$('.list').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (!b) return; st.i = Number(b.dataset.i); $('.panel').classList.remove('showlist'); render(); });
$('#prev').addEventListener('click', () => { if (st.i>0){ st.i--; render(); } });
$('#next').addEventListener('click', () => { if (st.i<KEYS.length){ st.i++; render(); } });
$('#fbk').addEventListener('click', () => go('thanks'));
$('#mtop').addEventListener('click', () => $('.panel').classList.toggle('showlist'));
$('#simok').addEventListener('click', () => go('success'));
$('#simno').addEventListener('click', () => go('failed'));
$$('.lang button').forEach(b => b.addEventListener('click', () => { st.lang = b.dataset.l; try{ localStorage.setItem('maana-lang', st.lang); }catch(e){} buildPanel(); render(); }));
function fit(){
  const wide = matchMedia('(min-width: 881px)').matches;
  const aw = wide ? Math.min(460, innerWidth - 520) : innerWidth - 32;
  const ah = wide ? innerHeight - 40 : Math.max(560, innerHeight - 40);
  phone.style.zoom = Math.max(0.55, Math.min(1, aw/414, ah/868));
}
addEventListener('resize', fit);
try { const l = localStorage.getItem('maana-lang'); if (l==='en'||l==='ar') st.lang = l; } catch(e){}
buildPanel(); render();
</script>
