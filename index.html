function suggestForm(){
  const L = st.lang==='ar';
  const s = sheet(`<h4>${L?'اقترح منتجاً تبيه':'Suggest a product'}</h4><p class="sl">${L?'قل لنا وش تحتاج كل شهر؛ لما يتجمع طلب كافٍ نتفاوض مع الموزع ونفتح حملة':'Tell us what you buy every month; when enough people want it, we negotiate with the distributor and open a campaign'}</p>

  $('#sggo', s).addEventListener('click', async () => {
    const n = $('#sgn', s).value.trim(); if (n.length < 2) return toast(L?'اكتب اسم المنتج':'Enter a product name');

function productText(to){
  const p = P(), L = st.lang==='ar';
  if (to.startsWith('@tier')){ const i = Number(to.slice(5)) - 1; const t = [p.t1, p.t2, p.t3][i], th = p.th[i];
    return i===0 ? (L ? `${th} كرتون: الحد الأدنى؛ تحت هذا العدد لا نشتري ولا نخصم شيئاً` : `${th} cartons: the minimum; below it we buy nothing and charge nothing`)
                 : (L ? `${th} كرتون: السعر ينزل إلى ${t} ر.س للجميع، حتى من انضم مبكراً` : `${th} cartons: price drops to SAR ${t} for everyone, early joiners too`); }

$$('.lang button').forEach(b => b.addEventListener('click', () => { st.lang = b.dataset.l; try{ localStorage.setItem('maana-lang', st.lang); }catch(e){} buildPanel(); render(); }));
function fit(){
  const wide = matchMedia('(min-width: 881px)').matches;
  const aw = wide ? Math.min(460, innerWidth - 520) : innerWidth - 32;
  const ah = wide ? innerHeight - 40 : Math.max(560, innerHeight - 40);
  phone.style.zoom = Math.max(0.55, Math.min(1, aw/414, ah/868));
}
addEventListener('resize', fit);
try { const l = localStorage.getItem('maana-lang'); if (l==='en'||l==='ar') st.lang = l; } catch(e){}
buildPanel(); render();
</script>
</body></html>
